<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>기니피그 농장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 말랑하고 귀여운 모바일 육성 게임
   IDEA: 톱밥 깔린 기니피그 농장과 동네 문방구 캡슐 뽑기 기계
   PICTURE: 화면 대부분을 차지하는 3D 농장, 쳇바퀴와 터널 사이를 돌아다니는 여러 마리 기니
   COLOUR and TYPE: 건초 크림 바탕, 밤색 글자, 당근 주황 강조, 코인 금색 / 둥근 Jua 한 가지
   LAYOUT: 위 상태 카드와 기니 목록, 가운데 3D 무대, 아래 큰 버튼 6개 */
:root{color-scheme:light dark;--bg:light-dark(#fff3e2,#22170f);--card:light-dark(#fffaf3e8,#33251ae8);--ink:light-dark(#3b2414,#fbead6);--soft:light-dark(#8a6a52,#c9ab8f);--acc:#e8743b;--line:light-dark(#ecd8bf,#4d3a2b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button,input{font-family:inherit}
.app{height:100dvh;display:grid;grid-template-rows:1fr auto;max-width:760px;margin:0 auto;position:relative}
.stage{position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;left:10px;right:10px;top:10px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px 12px 10px;backdrop-filter:blur(8px);box-shadow:0 6px 20px #6b3e1a1f;transition:opacity .3s,transform .3s}
.hud.mini .grow,.hud.mini .stats,.hud.mini .row{display:none}
#foldBtn svg{transition:transform .2s}.hud.mini #foldBtn svg{transform:rotate(180deg)}
.follow{position:absolute;right:12px;bottom:54px;display:flex;align-items:center;gap:6px;border:0;border-radius:99px;background:var(--acc);color:#fff;font-size:15px;min-height:44px;padding:0 14px;box-shadow:0 4px 12px #0003;cursor:pointer;z-index:2}
.hud.hide{opacity:0;transform:translateY(-20px);pointer-events:none}
.top{display:flex;align-items:center;gap:6px}
.name{font-size:23px;line-height:1.1;background:none;border:0;color:var(--ink);padding:4px 2px;cursor:pointer;min-height:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:8em}
.chip{font-size:13px;background:var(--acc);color:#fff;border-radius:99px;padding:3px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.coin{display:flex;align-items:center;gap:5px;border:0;background:#fff1c9;color:#7a4b00;border-radius:99px;padding:4px 10px 4px 5px;min-height:40px;font-size:17px;cursor:pointer;white-space:nowrap;flex:none}
.icon{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.grow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);margin:2px 0 7px;white-space:nowrap}
.grow .bar{flex:1;height:8px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 14px}
.st{display:grid;grid-template-columns:3.4em minmax(0,1fr) 2em;align-items:center;gap:6px;font-size:14px}
.st b{font-weight:400;text-align:right;color:var(--soft);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.row{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.pc{flex:none;display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:3px 11px 3px 5px;min-height:36px;font-size:14px;cursor:pointer;white-space:nowrap}
.pc.on{border-color:var(--acc);background:#e8743b22}
.pc i{width:20px;height:20px;border-radius:50%;border:2px solid #0002}
.lbls{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;transform:translate(-50%,-100%);font-size:13px;color:#fff;background:#3b2414aa;padding:1px 8px;border-radius:99px;white-space:nowrap}
.lb.on{background:var(--acc);font-size:14px}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#3b2414;font-size:16px;padding:6px 12px;border-radius:16px;box-shadow:0 4px 12px #0002;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .25s;z-index:2}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.bub.on{opacity:1}
.cpop{position:absolute;transform:translate(-50%,-100%);color:#7a4b00;background:#ffe27a;border-radius:99px;padding:2px 10px;font-size:16px;pointer-events:none;animation:cp 1.3s forwards;z-index:3;white-space:nowrap}
@keyframes cp{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-60px}}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#3b2414cc;color:#fff3e2;font-size:14px;padding:6px 14px;border-radius:99px;white-space:nowrap;pointer-events:none;transition:opacity .4s;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:var(--acc);color:#fff;font-size:21px;padding:12px 22px;border-radius:20px;opacity:0;pointer-events:none;transition:.3s;text-align:center;max-width:90%;z-index:7}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.act{min-height:54px;border-radius:18px;border:0;font-size:16px;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:inset 0 -4px 0 #0002;transition:transform .1s;padding:4px;white-space:nowrap}
.act:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 #0002}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.act[disabled]{filter:grayscale(.6) opacity(.6)}
.act svg{width:26px;height:26px;flex:none}
.f{background:#e8743b}.p{background:#4c9fd6}.w{background:#3fb6a8}.b{background:#c98a4b}.d{background:#9b6ee0}.g{background:#d65a9b}
.done{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;font-size:18px;background:#3fb6a8;color:#fff;border:0;border-radius:16px;padding:10px 18px;min-height:44px;cursor:pointer}
.groom{position:absolute;left:10px;right:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 14px;display:grid;gap:8px}
.groom .top{justify-content:space-between;font-size:15px}
.groom button{border:0;border-radius:14px;background:#c98a4b;color:#fff;font-size:16px;min-height:44px;padding:0 16px;cursor:pointer}
#comb{position:absolute;width:74px;height:74px;margin:-62px 0 0 -14px;pointer-events:none;z-index:3;transition:transform .08s}
#comb.on{transform:rotate(-12deg)}
.modal{position:absolute;inset:0;background:#0007;display:none;place-items:center;z-index:6}
.modal.on{display:grid}
.box{background:var(--bg);border-radius:26px;padding:18px;width:min(360px,92%);max-height:94dvh;overflow:auto;display:grid;gap:11px;text-align:center}
.box h2{margin:0;font-size:24px;font-weight:400;line-height:1.2}
.box p{margin:0;color:var(--soft)}
.box input{font-size:18px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:48px;text-align:center;width:100%}
.box input:focus{outline:none;border-color:var(--acc)}
.box input.bad{border-color:#e0475b;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.box button{flex:1;min-height:48px;border-radius:14px;border:0;font-size:17px;cursor:pointer;background:var(--line);color:var(--ink)}
.box .ok{background:var(--acc);color:#fff}
.box .ok[disabled]{opacity:.5}
.box small{color:var(--soft);font-size:13px}
.wide{width:100%}
.tabs{display:flex;gap:6px;background:var(--line);border-radius:16px;padding:4px}
.tabs button{min-height:40px;font-size:15px;background:none;border-radius:12px}
.tabs button.on{background:var(--bg);box-shadow:0 2px 6px #0001}
.odds{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:4px;font-size:13px}
.odds span{border-radius:10px;padding:4px 0;color:#fff;white-space:nowrap}
.mach{position:relative;height:196px;display:grid;place-items:center}
.mach svg{height:186px}
#knob{transform-origin:80px 144px;transition:transform 1s}
.spin #knob{transform:rotate(360deg)}
.spin .dome{animation:wob .25s 4}
@keyframes wob{50%{transform:translateX(3px)}}
.cap{position:absolute;left:50%;bottom:-6px;width:58px;height:58px;margin-left:-29px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 10px #0003;background:linear-gradient(#fff 0 50%,var(--cc,#e8743b) 50%);animation:drop 1.2s forwards}
@keyframes drop{0%{transform:translateY(-50px) scale(.4);opacity:0}35%{transform:none;opacity:1}50%{transform:rotate(-14deg)}65%{transform:rotate(14deg)}80%{transform:rotate(-8deg) scale(1.1)}100%{transform:scale(1.25);opacity:.9}}
.pvw{position:relative;height:190px;border-radius:20px;background:radial-gradient(circle at 50% 40%,#fff 0,#ffe7c4 70%);overflow:hidden}
#pv{width:100%;height:100%;display:block}
.rar{display:inline-block;color:#fff;border-radius:99px;padding:3px 12px;font-size:15px;justify-self:center}
.burst{position:absolute;inset:0;background:radial-gradient(circle,#fff 0,#fff0 60%);animation:bu .8s forwards;pointer-events:none}
@keyframes bu{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(2)}}
.sheetm{place-items:end center}
.sheet{width:min(560px,100%);background:var(--bg);border-radius:26px 26px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));display:grid;gap:12px;text-align:center}
.sheet h2{margin:0;font-size:22px;font-weight:400}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:8px 2px;display:grid;justify-items:center;gap:2px;cursor:pointer;font-size:15px;min-height:96px}
.opt svg{width:42px;height:42px}
.opt small{font-size:12px;color:var(--soft);line-height:1.2}
.opt.fav{border-color:#ec6f9a}
.sheet>button{min-height:46px;border-radius:14px;border:0;background:var(--line);color:var(--ink);font-size:17px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.it{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;min-height:52px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;padding:4px;line-height:1.15}
.it i{width:16px;height:16px;border-radius:50%;flex:none}
.it.on{border-color:var(--acc);background:#e8743b22}
.it[disabled]{opacity:.45;cursor:default}
.big{font-size:44px;color:#c98700;line-height:1}
.list{display:grid;gap:4px;font-size:14px;color:var(--soft);text-align:left;background:var(--card);border-radius:14px;padding:10px 12px}
.list div{display:flex;justify-content:space-between;gap:8px}
.list b{font-weight:400;color:var(--ink);white-space:nowrap}
@media(max-width:380px){.st{grid-template-columns:3em minmax(0,1fr) 1.8em;font-size:13px}.name{font-size:20px;max-width:5.5em}.act{font-size:14px;gap:3px}.act svg{width:22px;height:22px}.opt{font-size:13px}.opt svg{width:36px;height:36px}}
@media(prefers-reduced-motion:reduce){.bar i,.toast{transition:none}.cap,.cpop,.burst{animation-duration:.01s}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="lbls" id="lbls"></div>
    <div class="hud" id="hud">
      <div class="top">
        <button class="name" id="nameBtn" aria-label="이름 바꾸기">기니</button>
        <span class="chip" id="stageChip">아기</span>
        <span class="sp"></span>
        <button class="coin" id="coinBtn" aria-label="코인, 뽑기 열기"><svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="#f2b51d"/><circle cx="14" cy="14" r="8.5" fill="#ffd257" stroke="#d99700" stroke-width="1.5"/><text x="14" y="18.5" text-anchor="middle" font-size="12" fill="#a86b00" font-family="Jua,sans-serif">G</text></svg><span id="coinTxt">0</span></button>
        <button class="icon" id="foldBtn" aria-label="상태창 접기/펴기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
        <button class="icon" id="menuBtn" aria-label="메뉴"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      </div>
      <div class="grow"><span id="growTxt">성장</span><div class="bar"><i id="growBar" style="background:#b98de0;width:0"></i></div><span id="nextTxt"></span></div>
      <div class="stats" id="stats"></div>
      <div class="row" id="pigRow" hidden></div>
    </div>
    <div class="bub" id="bub"></div>
    <div class="hint" id="hint">빈 곳을 드래그하면 시야 이동, 두 손가락으로 확대·축소</div>
    <div class="toast" id="toast"></div>
    <button class="follow" id="followBtn" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="#fff"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>내 기니 보기</button>
    <button class="done" id="doneBtn" hidden>다 씻었어요</button>
    <svg id="comb" viewBox="0 0 74 74" hidden><rect x="6" y="8" width="58" height="20" rx="9" fill="#ff8fb3" stroke="#fff" stroke-width="3"/><g fill="#ff8fb3" stroke="#fff" stroke-width="1.5">
      <rect x="11" y="26" width="5" height="24" rx="2.5"/><rect x="19" y="26" width="5" height="26" rx="2.5"/><rect x="27" y="26" width="5" height="26" rx="2.5"/><rect x="35" y="26" width="5" height="26" rx="2.5"/><rect x="43" y="26" width="5" height="26" rx="2.5"/><rect x="51" y="26" width="5" height="24" rx="2.5"/></g><circle cx="20" cy="17" r="3" fill="#fff"/></svg>
    <div class="groom" id="groomUI" hidden>
      <div class="top"><span>빗질 <b id="brushPct">0</b>%</span><span id="furTxt">빠진 털 0가닥</span></div>
      <div class="bar"><i id="brushBar" style="background:#c98a4b;width:0"></i></div>
      <button id="groomDone">다 빗었어요</button>
    </div>

    <div class="modal" id="menu"><div class="box">
      <h2 id="menuTitle">우리 기니</h2>
      <p id="menuInfo"></p>
      <input id="renameIn" maxlength="8" placeholder="새 이름 (최대 8자)" aria-label="새 이름">
      <div class="btns"><button id="menuClose">닫기</button><button class="ok" id="renameBtn">이름 바꾸기</button></div>
      <div class="btns"><button id="sndBtn">소리 켜짐</button></div>
      <small>성장 10%마다 10코인, 청소년이 되면 30코인, 성체가 되면 60코인을 받아요. 행복한 성체 기니는 1분마다 2코인을 벌어 와요. 게임을 꺼 둔 동안에도 기니들은 천천히 자라고 코인을 모아요.</small>
      <div class="btns"><button id="resetBtn">농장 처음부터 다시 시작</button></div>
    </div></div>

    <div class="modal sheetm" id="sheet"><div class="sheet">
      <h2 id="shTitle"></h2><div class="opts" id="shOpts"></div><button id="shClose">닫기</button>
    </div></div>

    <div class="modal" id="gacha"><div class="box">
      <div id="gMach" style="display:grid;gap:11px">
        <div class="tabs"><button data-t="pig" class="on">기니 뽑기</button><button data-t="item">아이템 뽑기</button></div>
        <div class="mach" id="mach">
          <svg viewBox="0 0 160 190" aria-hidden="true">
            <g class="dome"><circle cx="80" cy="66" r="60" fill="#e9f7ff" stroke="#bfe0f2" stroke-width="4"/>
            <g id="balls"></g><path d="M45 35a42 42 0 0 1 30-14" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/></g>
            <rect id="machBase" x="26" y="114" width="108" height="68" rx="16" fill="#d65a9b"/>
            <rect x="58" y="166" width="44" height="14" rx="7" fill="#3b2414"/>
            <g id="knob"><circle cx="80" cy="144" r="15" fill="#fff"/><rect id="knobBar" x="77" y="131" width="6" height="26" rx="3" fill="#d65a9b"/></g>
          </svg>
        </div>
        <p id="gDesc"></p>
        <div class="odds" id="odds"></div>
        <small id="haveTxt"></small>
        <div class="btns"><button id="gClose">닫기</button><button class="ok" id="pullBtn">뽑기!</button></div>
      </div>
      <div id="gRev" hidden style="display:grid;gap:11px">
        <h2 id="revTitle">새 기니가 나왔어요!</h2>
        <div class="pvslot" id="slotG"></div>
        <span class="rar" id="revRar"></span>
        <h2 id="revBreed"></h2>
        <p id="revDesc"></p>
        <input id="nameIn" maxlength="8" placeholder="이름을 지어 주세요 (최대 8자)" aria-label="기니 이름">
        <button class="ok wide" id="adoptBtn">농장에 데려가기</button>
      </div>
      <div id="iRev" hidden style="display:grid;gap:11px">
        <h2 id="iTitle">새 아이템!</h2>
        <div class="pvslot" id="slotI"></div>
        <span class="rar" id="iRar"></span>
        <h2 id="iName"></h2>
        <p id="iDesc"></p>
        <div class="btns"><button id="iKeep">보관함에 넣기</button><button class="ok" id="iWear">입혀 보기</button></div>
      </div>
    </div></div>

    <div class="modal" id="ward"><div class="box">
      <h2 id="wTitle">꾸미기</h2>
      <div class="pvslot" id="slotW"></div>
      <div class="tabs" id="wTabs"></div>
      <div class="grid" id="wGrid"></div>
      <small id="wCount"></small>
      <button class="ok wide" id="wDone">다 했어요</button>
    </div></div>

    <div class="modal" id="away"><div class="box">
      <h2>다녀오셨어요!</h2>
      <p id="awTime"></p>
      <div class="big" id="awCoin"></div>
      <div class="list" id="awList"></div>
      <button class="ok wide" id="awOk">코인 받기</button>
    </div></div>

    <div class="pvw" id="pvBox"><canvas id="pv"></canvas><div class="burst" id="burst"></div></div>
  </div>
  <div class="acts">
    <button class="act f" id="feedBtn"><svg viewBox="0 0 32 32"><path d="M9 25 22 12l-3-3L6 22c-1 2 1 4 3 3z" fill="#fff"/><path d="M21 10c1-4 4-6 7-6-1 3-2 6-6 7M22 11c3-1 6 0 8 2-3 1-6 1-8-1" fill="#c9f2b5"/></svg>밥주기</button>
    <button class="act p" id="playBtn"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="#fff"/><path d="M5.5 13c6 3 15 3 21 0M5.5 19c6-3 15-3 21 0" stroke="#4c9fd6" stroke-width="2.4" fill="none"/></svg>놀아주기</button>
    <button class="act w" id="washBtn"><svg viewBox="0 0 32 32" fill="#fff"><circle cx="11" cy="18" r="7"/><circle cx="21" cy="12" r="5" opacity=".85"/><circle cx="23" cy="23" r="3.5" opacity=".7"/></svg>씻겨주기</button>

  const a=rnd(free),b=free.filter(p=>p!==a).sort((x,y)=>x.m.g.position.distanceTo(a.m.g.position)-y.m.g.position.distanceTo(a.m.g.position))[0];
  const kind=rnd(['boop','boop','nap','chase']),pa=a.m.g.position,pb=b.m.g.position;
  const mid=new THREE.Vector3().addVectors(pa,pb).multiplyScalar(0.5);const mr=Math.hypot(mid.x,mid.z);if(mr>5){mid.x*=5/mr;mid.z*=5/mr}
  const dir=new THREE.Vector3().subVectors(pb,pa);dir.y=0;if(dir.lengthSq()<0.01)dir.set(1,0,0);dir.normalize();const ang=Math.atan2(dir.x,dir.z);
  if(kind==='chase'){a.state='sChase';b.state='sFlee';a.soc={kind,partner:b,timer:5};b.soc={kind,partner:a,timer:0};b.target.copy(pb);say(a,rnd(['잡아라!','거기 서!','놀자!']),1.4);squeak(1,pitch(a)+300);return}
  const sa=sc(a),sb=sc(b);
  if(kind==='boop'){const gap=1.55*(sa+sb);a.target.copy(mid).addScaledVector(dir,-gap/2);b.target.copy(mid).addScaledVector(dir,gap/2);a.soc={kind,partner:b,face:ang,timer:8,lead:1};b.soc={kind,partner:a,face:ang+Math.PI,timer:8}}
  else{const gap=0.98*(sa+sb),perp=new THREE.Vector3(-dir.z,0,dir.x);a.target.copy(mid).addScaledVector(perp,-gap/2);b.target.copy(mid).addScaledVector(perp,gap/2);a.soc={kind,partner:b,face:ang,timer:8,lead:1};b.soc={kind,partner:a,face:ang,timer:8}}
  a.state=b.state='sGo';a.ready=b.ready=false}
let t=0,prev=performance.now(),uiT=0,saveT=0;const wantPos=new THREE.Vector3(),wantLook=new THREE.Vector3();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.1,(now-prev)/1000);prev=now;t+=dt;
  for(const P of pigs)updatePig(P,dt,t);
  social(dt);
  for(let i=0;i<pigs.length;i++)for(let j=i+1;j<pigs.length;j++){const A=pigs[i],B=pigs[j];if(A.lift>0.3||B.lift>0.3)continue;if(A.soc&&A.soc.partner===B&&SOC.includes(A.state))continue;const a=A.m.g.position,b=B.m.g.position,dx=b.x-a.x,dz=b.z-a.z,dd=Math.hypot(dx,dz)||0.01,min=(sc(A)+sc(B))*1.3;
    if(dd<min){const push=(min-dd)/2/dd,ai=isBusy(A),bj=isBusy(B);if(ai&&bj)continue;if(!ai){a.x-=dx*push*(bj?2:1);a.z-=dz*push*(bj?2:1)}if(!bj){b.x+=dx*push*(ai?2:1);b.z+=dz*push*(ai?2:1)}}}
  if(ball){const v=ball.userData.v;ball.position.addScaledVector(v,dt);v.multiplyScalar(Math.pow(0.45,dt));const r=Math.hypot(ball.position.x,ball.position.z);
    if(r>RAD-0.5){const nx=ball.position.x/r,nz=ball.position.z/r,dot=v.x*nx+v.z*nz;if(dot>0){v.x-=2*dot*nx;v.z-=2*dot*nz}ball.position.x=nx*(RAD-0.5);ball.position.z=nz*(RAD-0.5)}
    ball.rotation.x+=v.z*dt/0.28;ball.rotation.z-=v.x*dt/0.28}
  if(food&&food.position.y>0.36){food.userData.vy-=12*dt;food.position.y=Math.max(0.36,food.position.y+food.userData.vy*dt)}
  if(tub&&tub.scale.x<1)tub.scale.setScalar(Math.min(1,tub.scale.x+dt*3));
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.life-=dt*0.9;f.s.position.addScaledVector(f.v,dt);f.v.y+=(f.type==='drop'?-9:f.type==='fur'||f.type==='hay'?-1.6:0.3)*dt;f.v.x*=0.98;f.v.z*=0.98;f.s.material.rotation+=f.rot*dt;
    if(f.s.position.y<0.05){f.s.position.y=0.05;f.v.set(0,0,0)}
    f.s.scale.setScalar(f.size*Math.min(1,(1-f.life)*6+0.1));f.s.material.opacity=Math.min(1,f.life*2);if(f.life<=0){scene.remove(f.s);f.s.material.dispose();fx.splice(i,1)}}
  if(sel&&!groomP){const sp=sel.m.g.position,s=sc(sel);ring.visible=true;ring.position.x=sp.x;ring.position.z=sp.z;ring.scale.setScalar(s*(1.35+Math.sin(t*4)*0.05));
    if(!camFree)focus.lerp(tmp.set(clamp(sp.x,-5,5),0,clamp(sp.z,-5,4)),Math.min(1,dt*1.6))}else ring.visible=false;
  if(groomP){groomP.m.head.getWorldPosition(wantLook);const s=sc(groomP);wantPos.set(wantLook.x,wantLook.y+0.3*s,wantLook.z+2.3*s+0.9);wantLook.y-=0.05}
  else{wantPos.set(focus.x,camB.y*zoom,focus.z+camB.z*zoom);wantLook.set(focus.x,0.2,focus.z+0.4)}
  const k=Math.min(1,dt*(groomP?3:camFree?14:5));camPos.lerp(wantPos,k);camLook.lerp(wantLook,k);cam.position.copy(camPos);cam.lookAt(camLook);cam.updateMatrixWorld();
  for(const P of pigs){const [x,y,z]=toScreen(P,0.95+P.lift*0.6);P.lb.style.display=z>1?'none':'';P.lb.style.left=x+'px';P.lb.style.top=y+'px'}
  if(bubT>0&&bubP){bubT-=dt;if(bubT<=0)bub.classList.remove('on');const [x,y]=toScreen(bubP,1.35+bubP.lift*0.6);bub.style.left=x+'px';bub.style.top=(groomP?Math.max(70,y):y)+'px'}
  if(hintT>0&&!(actor&&(actor.state==='bath'||actor.state==='groom'))){hintT-=dt;if(hintT<=0)hint('')}
  uiT-=dt;if(uiT<=0){uiT=0.25;ui();setBtns()}saveT-=dt;if(saveT<=0){saveT=5;save()}
  R.render(scene,cam);
  if(pvOn&&pvM){pvM.g.rotation.y+=dt*0.8;pvM.rig.position.y=Math.abs(Math.sin(t*2.2))*0.12;pvR.render(pvS,pvCam)}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else prev=performance.now()});

/* ---------- 접속 보상 ---------- */
function showAway(){if(!away)return;$('#awTime').textContent='자리를 비운 '+fmtT(away.el)+' 동안 기니들이 코인을 모았어요';$('#awCoin').textContent='+'+away.coins+' 코인';
  $('#awList').innerHTML=away.lines.map(()=>`<div><span></span><b></b></div>`).join('');$('#awList').querySelectorAll('div').forEach((row,i)=>{const [n,g,c]=away.lines[i];row.children[0].textContent=n+' · '+g;row.children[1].textContent=c+'코인'});
  $('#away').classList.add('on')}
$('#awOk').onclick=()=>{initAudio();$('#away').classList.remove('on');blip(1320,0.15,'sine',0.07);setTimeout(()=>blip(1760,0.2,'sine',0.07),120);if(sel){tmp.copy(sel.m.g.position).y+=1;spawn('star',tmp,12,2)}away=null;save()};

function start(){for(const d of S.pigs)spawnPig(d);select(pigs.find(p=>p.d.id===S.sel)||pigs[0]);renderRow();ui();
  if(!pigs.length&&!S.pending)S.pending=newDef('american',0);if(S.pending)showReveal(S.pending);if(sel){focus.copy(sel.m.g.position);camPos.set(focus.x,camB.y,focus.z+camB.z);camLook.copy(focus)}showAway();save()}
start();requestAnimationFrame(loop);
}
