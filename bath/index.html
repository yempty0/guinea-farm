<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>기니피그 목욕시키기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 다정한 목욕 시뮬레이션, 짧고 귀여운 말투
   IDEA: 욕실 세면대에서 꼬질꼬질한 기니피그를 단계별로 씻기는 펫 미용실
   PICTURE: 화면 전체를 채운 실사풍 털 기니피그와 대야, 손가락을 따라다니는 도구
   COLOUR and TYPE: 욕실 타일 하늘색과 흰색, 따뜻한 나무, 비누 거품 흰색, 강조 코랄 / 둥근 Jua
   LAYOUT: 위 단계 카드, 가운데 3D, 아래 안내와 다음 단계 버튼 */
:root{--ink:#2f2520;--soft:#7b6a60;--acc:#ff7a59;--ok:#2fb57a;--card:#fffffff0;--line:#eadfd6}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#dfeef3;color:var(--ink);font:16px/1.45 Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button,input{font-family:inherit}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));background:var(--card);border-radius:22px;padding:10px 14px 12px;box-shadow:0 6px 20px #0002;max-width:620px;margin:0 auto}
.row{display:flex;align-items:center;gap:8px}
.stepNo{background:var(--acc);color:#fff;border-radius:99px;padding:2px 10px;font-size:14px;white-space:nowrap}
.stepName{font-size:21px;line-height:1.15;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pct{font-size:17px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7fd3f0,#3fb6a8);transition:width .25s}
.dots{display:flex;gap:4px;margin-top:8px}
.dots span{flex:1;height:5px;border-radius:99px;background:var(--line)}
.dots span.d{background:#3fb6a8}.dots span.c{background:var(--acc)}
.bottom{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:grid;gap:8px;max-width:620px;margin:0 auto}
.hint{background:#2f2520d9;color:#fff;border-radius:16px;padding:9px 14px;font-size:15px;text-align:center}
.btns{display:flex;gap:8px}
.btn{border:0;border-radius:18px;min-height:52px;font-size:18px;cursor:pointer;padding:0 16px;color:#fff;background:#8b7b72;box-shadow:inset 0 -4px 0 #0002}
.btn.go{flex:1;background:var(--ok)}
.btn.go[disabled]{background:#b9aea7}
.btn:active{transform:translateY(2px)}
.icon{width:52px;flex:none;display:grid;place-items:center;padding:0;background:#fff;color:var(--ink);box-shadow:0 3px 10px #0002}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#tool{position:fixed;width:84px;height:84px;margin:-70px 0 0 -14px;pointer-events:none;z-index:3;filter:drop-shadow(0 4px 6px #0004);transition:transform .08s}
#tool.on{transform:rotate(-10deg) scale(1.05)}
.bub{position:fixed;transform:translate(-50%,-100%);background:#fff;color:var(--ink);font-size:16px;padding:6px 12px;border-radius:16px;box-shadow:0 4px 12px #0002;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .25s;z-index:2}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.bub.on{opacity:1}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);background:var(--ok);color:#fff;font-size:22px;padding:12px 22px;border-radius:20px;opacity:0;pointer-events:none;transition:.3s;z-index:5;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.modal{position:fixed;inset:0;background:#0006;display:none;place-items:center;z-index:6}
.modal.on{display:grid}
.box{background:#fffaf5;border-radius:26px;padding:22px 20px;width:min(360px,92%);max-height:94dvh;overflow:auto;display:grid;gap:12px;text-align:center}
.box h1,.box h2{margin:0;font-weight:400;line-height:1.2}.box h1{font-size:28px}.box h2{font-size:23px}
.box p{margin:0;color:var(--soft)}
.box input{font-size:18px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;min-height:50px;text-align:center;width:100%;color:var(--ink)}
.box input:focus{outline:none;border-color:var(--acc)}
.coats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.coat{width:52px;height:52px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.coat.on{box-shadow:0 0 0 3px var(--acc)}
.steps{text-align:left;font-size:14px;color:var(--soft);background:#fff;border-radius:14px;padding:10px 14px;columns:2;column-gap:14px}
.steps div{break-inside:avoid}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fffaf5;border-radius:24px 24px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:grid;gap:10px;box-shadow:0 -6px 20px #0002;max-width:620px;margin:0 auto;z-index:4}
.tabs{display:flex;gap:6px;background:var(--line);border-radius:16px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:12px;min-height:40px;font-size:16px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:#fff;box-shadow:0 2px 6px #0001}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.it{border:2px solid var(--line);background:#fff;border-radius:14px;min-height:54px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px;color:var(--ink);line-height:1.15}
.it i{width:16px;height:16px;border-radius:50%;flex:none;border:1px solid #0002}
.it.on{border-color:var(--acc);background:#fff1ec}
#photo{width:100%;border-radius:18px;display:block;box-shadow:0 4px 14px #0002}
@media(max-width:380px){.stepName{font-size:18px}.hint{font-size:14px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top" id="top">
  <div class="row"><span class="stepNo" id="stepNo">1 / 10</span><span class="stepName" id="stepName"></span><span class="pct" id="pct">0%</span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="dots" id="dots"></div>
</div>
<svg id="tool" viewBox="0 0 84 84" hidden></svg>
<div class="bub" id="bub"></div>
<div class="toast" id="toast"></div>
<div class="bottom" id="bottom">
  <div class="hint" id="hint"></div>
  <div class="btns">
    <button class="btn icon" id="viewBtn" aria-label="시점 처음으로"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <button class="btn go" id="nextBtn" disabled>다음 단계</button>
  </div>
</div>
<div class="sheet" id="dress" hidden>
  <div class="tabs" id="dTabs"></div>
  <div class="items" id="dItems"></div>
  <button class="btn go" id="finishBtn">완성!</button>
</div>
<div class="modal on" id="start"><div class="box">
  <h1>꼬질꼬질 기니피그 목욕시키기</h1>
  <p>마당에서 뒹굴다 온 기니피그가 왔어요. 깨끗하게 씻기고 예쁜 옷까지 입혀 주세요!</p>
  <div class="coats" id="coats"></div>
  <input id="nameIn" maxlength="8" placeholder="이름을 지어 주세요" aria-label="기니피그 이름">
  <div class="steps" id="stepList"></div>
  <button class="btn go" id="startBtn">목욕 시작</button>
  <p style="font-size:13px">빈 곳을 드래그하면 시점 회전, 두 손가락으로 확대·축소</p>
</div></div>
<div class="modal" id="final"><div class="box">
  <h2 id="finTitle">목욕 완성!</h2>
  <img id="photo" alt="완성한 기니피그 사진">
  <p id="finText"></p>
  <div class="btns"><button class="btn" id="againBtn" style="flex:1;background:var(--acc)">다른 기니 씻기기</button></div>
  <button class="btn" id="closeFin" style="background:#8b7b72">계속 구경하기</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1)-0xAC00;return w+(c>=0&&c<11172&&c%28?a:b)};

/* ---------- 데이터 ---------- */
const COATS=[

  {id:'rinse',n:'깨끗하게 헹구기',tool:'shower',hint:'거품이 하나도 남지 않게 꼼꼼히 헹궈요',goal:0.95,lines:['뽀득뽀득','거품 안녕~','개운해요']},

const SLOTS=[['head','모자'],['body','옷'],['neck','목']];

  bee:{n:'꿀벌 옷',s:'body',c:'#f6c529'},santa:{n:'산타 옷',s:'body',c:'#d72631'},cape:{n:'공주 망토',s:'body',c:'#f48fb1'},knit:{n:'줄무늬 니트',s:'body',c:'#7ec4e8'},
  bow:{n:'리본',s:'neck',c:'#ff5d8f'},bell:{n:'방울 목걸이',s:'neck',c:'#e0a800'},scarf:{n:'목도리',s:'neck',c:'#e8473b'}};

const cv=$('#cv');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});

// 환경 반사 (눈망울·세면대 광택)
{const es=new THREE.Scene();es.background=new THREE.Color('#bfd6df');const w=new THREE.Mesh(new THREE.PlaneGeometry(6,4),new THREE.MeshBasicMaterial({color:'#ffffff'}));w.position.set(2,3,-4);w.lookAt(0,0,0);es.add(w);
  const w2=w.clone();w2.position.set(-4,2,3);w2.lookAt(0,0,0);w2.scale.setScalar(0.5);es.add(w2);const pm=new THREE.PMREMGenerator(R);scene.environment=pm.fromScene(es,0.02).texture}

const LIGHT=new V3(3,6,4).normalize();

// 욕실 벽 타일, 나무 선반

{const pts=[];for(let i=0;i<=12;i++){const f=i/12;pts.push(new THREE.Vector2(2.0+f*0.55+Math.sin(f*1.6)*0.05,f*0.72))}pts.push(new THREE.Vector2(2.62,0.74),new THREE.Vector2(2.66,0.7));

/* ---------- 기니피그 몸 모양 (한 덩어리) ---------- */
const LZ=1.2,PIV=0.45,PY=0.62;
const PT=[-1,-0.7,-0.3,0.1,0.4,0.6,0.8,0.92,1],PW=[.58,.66,.69,.67,.63,.6,.55,.5,.46],PH=[.58,.64,.68,.68,.67,.65,.6,.54,.48],PC=[.59,.6,.61,.61,.62,.62,.6,.58,.56];
function ip(arr,t){for(let i=0;i<PT.length-1;i++)if(t<=PT[i+1]){const f=(t-PT[i])/(PT[i+1]-PT[i]),s=f*f*(3-2*f);return arr[i]+(arr[i+1]-arr[i])*s}return arr[arr.length-1]}
const env=t=>Math.pow(Math.max(0,1-t*t),t<0?0.3:0.09);
const sst=(a,b,x)=>{const f=clamp((x-a)/(b-a),0,1);return f*f*(3-2*f)};
function bodyPt(t,a,off,out){const e=env(t),W=ip(PW,t)*e,H=ip(PH,t)*e,C=ip(PC,t),sa=Math.sin(a),ca=Math.cos(a);
  // 빵빵한 볼살(수염 패드): 주둥이 양옆 아래가 불룩하게

  if(now-lastPaint<28)return;lastPaint=now;
  if(s==='debris'){for(const d of debris)if(d.on&&d.m.position.distanceTo(lp)<0.3){d.on=false;d.v.set((Math.random()-.5)*2,2+Math.random()*1.5,(Math.random()-.5)*2);if(Math.random()<0.5)squeak(1,1250)}if(Math.random()<0.05)say(rnd(STEPS[0].lines))}
  else if(s==='wet'||s==='rinse'){hum('shower');for(let i=0;i<3;i++){const src=pt.clone().addScaledVector(toCam,0.5).add(new V3((Math.random()-.5)*0.3,0.9,(Math.random()-.5)*0.3));spawn('drop',src,pt.clone().sub(src).multiplyScalar(3.2),0.35,0.07)}
    if(onSkin){if(s==='wet')paint('wet',uv.x,uv.y,true,0.35,1.2);else{paint('foam',uv.x,uv.y,false,0.32,1.2);paint('dirt',uv.x,uv.y,false,0.1,1.2);paint('wet',uv.x,uv.y,true,0.3,1.2);if(sample('foam',uv.x,uv.y)>0.1)spawn('bubble',pt.clone().addScaledVector(toCam,0.1),new V3((Math.random()-.5)*0.3,-1.2,(Math.random()-.5)*0.3),0.8,0.08)}}
    shiverT=0.4}
  else if(s==='soap'){if(onSkin){paint('foam',uv.x,uv.y,true,0.3,1.1);if(Math.random()<0.6)spawn('bubble',pt.clone().addScaledVector(toCam,0.12),new V3((Math.random()-.5)*0.4,0.4+Math.random()*0.4,(Math.random()-.5)*0.4),1.2,0.06+Math.random()*0.08)}}
  else if(s==='scrub'){hum('scrub');if(onSkin){const f=sample('foam',uv.x,uv.y);paint('dirt',uv.x,uv.y,false,0.06+0.22*f,1.0);paint('foam',uv.x,uv.y,true,0.06,1.0);
      if(Math.random()<0.7)spawn('bubble',pt.clone().addScaledVector(toCam,0.12),new V3((Math.random()-.5)*0.5,0.5,(Math.random()-.5)*0.5),1,0.05+Math.random()*0.07,sample('dirt',uv.x,uv.y)>0.3?'#b9a48f':'#ffffff');if(f<0.2&&Math.random()<0.04)toast('거품을 더 칠하면 잘 지워져요')}}
  else if(s==='face'){const wp=pt;for(const c of crusts){if(!c.on)continue;const cp=c.m.getWorldPosition(new V3());if(cp.distanceTo(wp)<0.16){c.hp-=0.34;c.m.scale.setScalar(Math.max(0.3,c.hp/3));if(c.hp<=0.01){c.hp=0;c.on=false;c.m.visible=false;squeak(1,1300);spawn('spark',cp,new V3(0,0.6,0),0.6,0.15)}}}eyeSquint=0.6}
  else if(s==='towel'){if(onSkin){paint('wet',uv.x,uv.y,false,0.13,1.4);if(Math.random()<0.3)spawn('drop',pt.clone(),new V3((Math.random()-.5),0.3,(Math.random()-.5)),0.5,0.05)}}
  else if(s==='dry'){hum('dryer');const wind=pt.clone().sub(cam.position).setY(0).normalize().multiplyScalar(1.8);wind.y=0.4;furU.uWind.value.lerp(pig.worldToLocal(wind.add(pig.position)).sub(pig.worldToLocal(pig.position.clone())),0.3);
    if(onSkin){paint('wet',uv.x,uv.y,false,0.16,1.6);if(Math.random()<0.4)spawn('fluff',pt.clone().addScaledVector(toCam,0.05),new V3((Math.random()-.5)*1.5,0.8,(Math.random()-.5)*1.5),1,0.1,`rgb(${COATS[coat].base})`)}eyeSquint=0.5}
  else if(s==='brush'){if(onSkin){paint('shine',uv.x,uv.y,true,0.3,1.1);if(Math.random()<0.25)spawn('spark',pt.clone().addScaledVector(toCam,0.1),new V3(0,0.4,0),0.7,0.1);if(Math.random()<0.15)spawn('fluff',pt.clone(),new V3((Math.random()-.5),0.2,(Math.random()-.5)),1.2,0.09,`rgb(${COATS[coat].base})`)}}
  if(Math.random()<0.012&&speakT<=0){say(rnd(STEPS[step].lines));squeak(1)}}

/* ---------- 옷 입히기 화면 ---------- */
let dSlot='head';
function renderDress(){$('#dTabs').innerHTML=SLOTS.map(([k,n])=>`<button data-s="${k}" class="${k===dSlot?'on':''}">${n}</button>`).join('');
  $('#dTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{dSlot=b.dataset.s;renderDress()});
  const list=Object.keys(OUTFITS).filter(k=>OUTFITS[k].s===dSlot);
  $('#dItems').innerHTML=`<button class="it${!wear[dSlot]?' on':''}" data-k="">없음</button>`+list.map(k=>`<button class="it${wear[dSlot]===k?' on':''}" data-k="${k}"><i style="background:${OUTFITS[k].c}"></i>${OUTFITS[k].n}</button>`).join('');
  $('#dItems').querySelectorAll('.it').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k)wear[dSlot]=k;else delete wear[dSlot];dressUp();renderDress();squeak(1,1300);if(k)say(rnd(STEPS[9].lines))})}
$('#finishBtn').onclick=()=>{done=true;$('#dress').hidden=true;orbW.set(0.45,1.12,4.6*(innerWidth/innerHeight<0.8?1.4:1));squeak(3,1350);say('짠!',2);
  setTimeout(()=>{for(let i=0;i<30;i++)spawn('spark',new V3((Math.random()-.5)*3,0.5+Math.random()*1.8,(Math.random()-.5)*3),new V3(0,0.5,0),1.5,0.14);
    setTimeout(()=>{R.render(scene,cam);try{$('#photo').src=cv.toDataURL('image/jpeg',0.9)}catch(e){}const nm=name||'기니';$('#finTitle').textContent=josa(nm,'이','')+' 목욕 완성!';
      $('#finText').textContent=`지푸라기 ${debris.length}개 떼고, 거품 목욕하고, 보송하게 말렸어요. 깨끗함 100%! 사진을 길게 누르면 저장할 수 있어요.`;$('#final').classList.add('on')},700)},900)};
$('#closeFin').onclick=()=>{$('#final').classList.remove('on');$('#dress').hidden=false;done=false};
$('#againBtn').onclick=()=>{$('#final').classList.remove('on');for(const k in wear)delete wear[k];dressUp();coat=(coat+1+Math.floor(Math.random()*(COATS.length-1)))%COATS.length;document.querySelectorAll('.coat').forEach((x,i)=>x.classList.toggle('on',i===coat));paintCoat(coat);$('#nameIn').value='';$('#start').classList.add('on');done=false;newGame()};
function newGame(){resetMasks();dirtStart=MK.dirt.cov;makeDebris();makeCrusts();setStep(0);pig.rotation.y=-0.45}
$('#startBtn').onclick=()=>{initAudio();name=$('#nameIn').value.trim().slice(0,8);$('#start').classList.remove('on');say(name?`나는 ${name}! 씻겨 주세요…`:'씻겨 주세요…',2.4);squeak(2)};
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#startBtn').click()});

/* ---------- 루프 ---------- */
let t=0,prev=performance.now(),mT=0,eyeSquint=0,yawT=0,yawW=0;const bub=$('#bub');
function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.05,(now-prev)/1000);prev=now;t+=dt;
  furU.uTime.value=t;furU.uBreath.value=Math.sin(t*3.3)*0.012;
  yawT-=dt;if(yawT<=0){yawT=2+Math.random()*3;yawW=toolOn?(Math.random()-.5)*0.2:(Math.random()-.5)*0.6}
  furU.uYaw.value+=(yawW-furU.uYaw.value)*Math.min(1,dt*2);furU.uPitch.value=Math.sin(t*0.7)*0.04+(STEPS[step].id==='face'?0.05:0);head.rotation.set(furU.uPitch.value,furU.uYaw.value,0);
  if(shiverT>0){shiverT-=dt;furU.uShake.value=Math.sin(t*70)*0.25*Math.min(1,shiverT*3)}else furU.uShake.value*=0.8;
  if(shakeT>0){shakeT-=dt;pig.rotation.z=Math.sin(t*45)*0.12*Math.min(1,shakeT);if(Math.random()<0.6)spawn('drop',pig.localToWorld(new V3((Math.random()-.5)*1.6,0.8+Math.random()*0.5,(Math.random()-.5)*2.2)),new V3((Math.random()-.5)*5,1.5+Math.random()*2,(Math.random()-.5)*5),0.8,0.07)}else pig.rotation.z*=0.85;
  const tw=Math.sin(t*24)*(Math.sin(t*1.3)>0.4?1:0);head.children.forEach(c=>{if(c.isLine)c.rotation.x=tw*0.02});
  eyeSquint=Math.max(0,eyeSquint-dt);const ey=eyeSquint>0?0.35:(Math.sin(t*0.37)>0.995?0.1:1);eyes.forEach(e=>{e.scale.y+=(ey-e.scale.y)*Math.min(1,dt*15)});
  ears.forEach((e,i)=>{e.rotation.x=e.userData.rx+Math.sin(t*1.7+i)*0.03+(Math.sin(t*0.5+i*2)>0.97?0.12:0)});
  if(!toolOn)furU.uWind.value.multiplyScalar(0.9);
  for(const d of debris)if(!d.on&&d.m.visible){d.v.y-=6*dt;d.m.position.addScaledVector(d.v,dt);d.m.rotation.x+=dt*6;if(d.m.position.y<-1)d.m.visible=false}
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.life-=dt;f.s.position.addScaledVector(f.v,dt);if(f.type==='drop')f.v.y-=9*dt;else if(f.type==='fluff')f.v.y-=0.6*dt;else if(f.type==='bubble')f.v.multiplyScalar(0.96);
    f.s.material.opacity=Math.min(1,f.life/f.max*2);if(f.life<=0){scene.remove(f.s);f.s.material.dispose();fx.splice(i,1)}}
  const murk=clamp((dirtStart-MK.dirt.cov)/dirtStart,0,1)*(step<=5?1:0);waterM.color.setRGB(0.75-0.2*murk,0.88-0.4*murk,0.93-0.6*murk);
  shadow.position.set(pig.position.x,0.012,pig.position.z);shadow.rotation.z=-pig.rotation.y;
  mT-=dt;if(mT<=0){mT=0.25;measure();const p=clamp(progress(),0,1);prog=p;$('#bar').style.width=p*100+'%';$('#pct').textContent=Math.floor(p*100)+'%';
    if(!stepDone&&STEPS[step].id!=='dress'&&p>=0.999){stepDone=true;$('#nextBtn').disabled=false;toast(rnd(['잘했어요!','완벽해요!','최고예요!']));squeak(2,1300)}}
  camUpdate(dt);furU.uCam.value.copy(cam.position);
  if(speakT>0){speakT-=dt;if(speakT<=0)bub.classList.remove('on');const hp=head.localToWorld(new V3(0,0.55,0.4));hp.project(cam);bub.style.left=(hp.x+1)/2*innerWidth+'px';bub.style.top=Math.max(150,(1-hp.y)/2*innerHeight)+'px'}
  R.render(scene,cam)}
paintCoat(0);newGame();requestAnimationFrame(loop);
}
</script>
</body>
</html>
