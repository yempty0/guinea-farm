<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>기니피그 엉덩이털 미용실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 장난스럽고 다정한 펫 미용실
   IDEA: 폭신한 하늘색 담요 위, 코앞에 들이민 기니피그 엉덩이를 다듬는 미용 의자
   PICTURE: 화면을 꽉 채운 실사풍 털 엉덩이와 분홍 뒷발, 손가락을 따라다니는 미용 도구
   COLOUR and TYPE: 담요 하늘색, 크림 흰색, 엉덩이 분홍 강조 / 둥근 Jua
   LAYOUT: 위 완성도 카드, 가운데 3D, 아래 도구 막대와 완성 버튼 */
:root{--ink:#2f2520;--soft:#7b6a60;--acc:#ff7a8a;--ok:#2fb57a;--card:#fffffff0;--line:#e8e0da}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#bfe1ea;color:var(--ink);font:16px/1.45 Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button,input{font-family:inherit}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));background:var(--card);border-radius:22px;padding:10px 14px 12px;box-shadow:0 6px 20px #0002;max-width:620px;margin:0 auto}
.row{display:flex;align-items:center;gap:8px}
.title{font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total{font-size:22px;color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap}
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.mt{font-size:13px;color:var(--soft);display:grid;gap:3px;text-align:center;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .25s}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:grid;gap:8px;max-width:640px;margin:0 auto}
.hint{background:#2f2520d9;color:#fff;border-radius:16px;padding:8px 14px;font-size:15px;text-align:center;justify-self:center;max-width:100%}
.tools{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tl{flex:none;scroll-snap-align:start;width:66px;min-height:70px;border:0;border-radius:18px;background:#fff;color:var(--ink);display:grid;justify-items:center;align-content:center;gap:2px;font-size:13px;cursor:pointer;box-shadow:0 3px 10px #0002}
.tl svg{width:34px;height:34px}
.tl.on{background:var(--acc);color:#fff;box-shadow:0 0 0 3px #fff,0 3px 10px #0003}
.sub{display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:none}
.sub button{flex:none;min-height:44px;border:2px solid #fff;border-radius:99px;padding:0 12px;font-size:14px;cursor:pointer;background:#ffffffd9;color:var(--ink);display:flex;align-items:center;gap:6px}
.sub button.on{border-color:var(--acc);background:#fff}
.sub i{width:18px;height:18px;border-radius:50%;border:1px solid #0002}
.acts{display:flex;gap:8px}
.btn{border:0;border-radius:18px;min-height:52px;font-size:18px;cursor:pointer;padding:0 16px;color:#fff;background:#8b7b72;box-shadow:inset 0 -4px 0 #0002}
.btn.go{flex:1;background:var(--ok)}
.btn.icon{width:52px;flex:none;display:grid;place-items:center;padding:0;background:#fff;color:var(--ink);box-shadow:0 3px 10px #0002}
.btn:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#tool{position:fixed;width:84px;height:84px;margin:-70px 0 0 -14px;pointer-events:none;z-index:3;filter:drop-shadow(0 4px 6px #0004);transition:transform .08s}
#tool.on{transform:rotate(-10deg) scale(1.05)}
.bub{position:fixed;transform:translate(-50%,-100%);background:#fff;color:var(--ink);font-size:17px;padding:6px 13px;border-radius:16px;box-shadow:0 4px 12px #0002;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .25s;z-index:2}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.bub.on{opacity:1}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);background:var(--acc);color:#fff;font-size:20px;padding:10px 20px;border-radius:20px;opacity:0;pointer-events:none;transition:.3s;z-index:5;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.modal{position:fixed;inset:0;background:#0006;display:none;place-items:center;z-index:6}
.modal.on{display:grid}
.box{background:#fffaf5;border-radius:26px;padding:22px 20px;width:min(360px,92%);max-height:94dvh;overflow:auto;display:grid;gap:12px;text-align:center}
.box h1,.box h2{margin:0;font-weight:400;line-height:1.2}.box h1{font-size:27px}.box h2{font-size:24px}
.box p{margin:0;color:var(--soft)}
.box input{font-size:18px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;min-height:50px;text-align:center;width:100%;color:var(--ink)}
.box input:focus{outline:none;border-color:var(--acc)}
.coats{display:flex;gap:10px;justify-content:center}
.coat{width:56px;height:56px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.coat.on{box-shadow:0 0 0 3px var(--acc)}
.res{display:grid;gap:4px;background:#fff;border-radius:14px;padding:10px 14px;text-align:left;font-size:15px}
.res div{display:flex;justify-content:space-between}.res b{font-weight:400;color:var(--acc)}
.big{font-size:46px;color:var(--acc);line-height:1}
#photo{width:100%;border-radius:18px;display:block}
@media(max-width:380px){.tl{width:60px;font-size:12px}.title{font-size:17px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top">
  <div class="row"><span class="title" id="title">엉덩이 완성도</span><span class="total" id="total">0%</span></div>
  <div class="meters">
    <div class="mt">깨끗함<div class="bar"><i id="m0" style="background:#5ec4e6"></i></div></div>
    <div class="mt">엉킴 풀기<div class="bar"><i id="m1" style="background:#c98a4b"></i></div></div>
    <div class="mt">동그라미<div class="bar"><i id="m2" style="background:#ff7a8a"></i></div></div>
    <div class="mt">보송함<div class="bar"><i id="m3" style="background:#f2b51d"></i></div></div>
  </div>
</div>
<svg id="tool" viewBox="0 0 84 84" hidden></svg>
<div class="bub" id="bub"></div>
<div class="toast" id="toast"></div>
<div class="bottom" id="bottom">
  <div class="hint" id="hint"></div>
  <div class="sub" id="sub" hidden></div>
  <div class="tools" id="tools"></div>
  <div class="acts">
    <button class="btn icon" id="viewBtn" aria-label="시점 처음으로"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <button class="btn go" id="doneBtn">완성!</button>
  </div>
</div>
<div class="modal on" id="start"><div class="box">
  <h1>기니피그 엉덩이털 미용실</h1>
  <p>엉덩이 털이 삐죽삐죽, 엉키고 꼬질꼬질해진 기니피그가 왔어요. 씻기고 빗기고 잘라서 동그랗고 탐스러운 엉덩이를 만들어 주세요!</p>
  <div class="coats" id="coats"></div>
  <input id="nameIn" maxlength="8" placeholder="이름을 지어 주세요" aria-label="기니피그 이름">
  <button class="btn go" id="startBtn">미용 시작</button>
  <p style="font-size:13px">빈 곳을 드래그하면 시점 회전, 두 손가락으로 확대·축소. 털을 잡아당기면 살도 말랑하게 따라와요.</p>
</div></div>
<div class="modal" id="final"><div class="box">
  <h2 id="finTitle"></h2>
  <img id="photo" alt="완성 기념사진">
  <div class="big" id="finScore"></div>
  <div class="res" id="finRes"></div>
  <p id="finText"></p>
  <button class="btn go" id="againBtn">다른 기니 미용하기</button>
  <button class="btn" id="closeFin">계속 구경하기</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1)-0xAC00;return w+(c>=0&&c<11172&&c%28?a:b)};
const sst=(a,b,x)=>{const f=clamp((x-a)/(b-a),0,1);return f*f*(3-2*f)};
const V3=THREE.Vector3;

/* ---------- 털 무늬 ---------- */
const COATS=[
  {n:'흰색에 갈색 얼룩',sw:'radial-gradient(circle at 30% 40%,#b07a4a 0 28%,#f4efe8 30%)',base:[244,239,232],p:[[[176,122,74],0.6,'head'],[[150,120,100],0.62,'rear']]},
  {n:'올 화이트',sw:'#f7f3ee',base:[247,243,238],p:[]},
  {n:'삼색',sw:'radial-gradient(circle at 30% 40%,#c4722c 0 25%,#2b2420 26% 40%,#efe9e0 41%)',base:[239,233,224],p:[[[196,110,40],0.5,'any'],[[38,32,29],0.64,'any']]}];
const TOOLS=[
  {id:'hand',n:'만지기',hint:'엉덩이를 꾹 누르거나 잡아당겨 보세요. 말랑말랑!',ic:'<path d="M30 70c-8-6-14-18-12-26 1-5 7-5 9 0l3 6V20c0-5 7-5 7 0v20-26c0-5 7-5 7 0v26-22c0-5 7-5 7 0v24-16c0-5 7-5 7 0v28c0 14-8 24-20 24-4 0-6-1-8-2z" fill="#ffd9c2" stroke="#c99079" stroke-width="2.5"/>'},
  {id:'comb',n:'빗질',hint:'엉킨 털을 빗어서 풀어요. 엉킨 곳은 털이 당겨져요!',ic:'<rect x="12" y="18" width="60" height="18" rx="8" fill="#c98a4b" stroke="#8a5a2b" stroke-width="2"/><g fill="#c98a4b" stroke="#8a5a2b" stroke-width="1.5"><rect x="16" y="34" width="5" height="26" rx="2.5"/><rect x="25" y="34" width="5" height="28" rx="2.5"/><rect x="34" y="34" width="5" height="28" rx="2.5"/><rect x="43" y="34" width="5" height="28" rx="2.5"/><rect x="52" y="34" width="5" height="28" rx="2.5"/><rect x="61" y="34" width="5" height="26" rx="2.5"/></g>'},
  {id:'shower',n:'샤워',hint:'샤워기로 엉덩이를 적시고, 거품은 물로 헹궈요',ic:'<rect x="40" y="6" width="10" height="40" rx="5" fill="#cfd8dc" stroke="#8a9aa3" stroke-width="2"/><path d="M22 46h46l-6 12H28z" fill="#e3ebef" stroke="#8a9aa3" stroke-width="2"/><g fill="#7fc8f0"><circle cx="32" cy="66" r="3"/><circle cx="45" cy="70" r="3"/><circle cx="58" cy="66" r="3"/><circle cx="38" cy="78" r="2.5"/><circle cx="52" cy="79" r="2.5"/></g>'},
  {id:'shampoo',n:'샴푸',hint:'젖은 털에 샴푸를 문지르면 거품이 나면서 때가 빠져요',ic:'<rect x="26" y="26" width="32" height="46" rx="10" fill="#9ad7c9" stroke="#4fa192" stroke-width="2.5"/><rect x="34" y="12" width="16" height="16" rx="3" fill="#fff" stroke="#4fa192" stroke-width="2.5"/><circle cx="42" cy="50" r="8" fill="#fff" opacity=".8"/><circle cx="64" cy="74" r="6" fill="#fff" stroke="#cde" stroke-width="1.5"/><circle cx="72" cy="64" r="4" fill="#fff" stroke="#cde" stroke-width="1.5"/>'},
  {id:'scissors',n:'가위',hint:'삐죽 튀어나온 털을 잘라 동그랗게 다듬어요',ic:'<g stroke="#6b7a86" stroke-width="5" stroke-linecap="round"><path d="M30 56 62 14"/><path d="M54 56 22 14"/></g><g fill="none" stroke="#ff7a8a" stroke-width="5"><circle cx="26" cy="66" r="10"/><circle cx="58" cy="66" r="10"/></g><circle cx="42" cy="35" r="3" fill="#6b7a86"/>'},
  {id:'dryer',n:'드라이어',hint:'젖은 털을 보송보송하게 말려요',ic:'<circle cx="34" cy="30" r="20" fill="#ff9db0" stroke="#d76d84" stroke-width="2.5"/><rect x="50" y="22" width="26" height="16" rx="5" fill="#ff9db0" stroke="#d76d84" stroke-width="2.5"/><rect x="26" y="46" width="14" height="32" rx="6" fill="#ff9db0" stroke="#d76d84" stroke-width="2.5"/><circle cx="34" cy="30" r="8" fill="#fff"/>'},
  {id:'deco',n:'꾸미기',hint:'염색 펜으로 칠하거나, 장식을 골라 엉덩이를 톡 눌러 붙여요',ic:'<path d="M42 10l8 18 20 2-15 13 5 20-18-11-18 11 5-20L14 30l20-2z" fill="#ffd257" stroke="#e0a800" stroke-width="2.5"/>'}];
const DECO=[{id:'pink',n:'분홍 펜',c:'#ff8fb8'},{id:'mint',n:'민트 펜',c:'#7fe0c8'},{id:'lilac',n:'보라 펜',c:'#c3a6ff'},{id:'lemon',n:'노랑 펜',c:'#ffe27a'},
  {id:'ribbon',n:'리본',c:'#ff5d8f',st:1},{id:'heart',n:'하트',c:'#ff3d6e',st:1},{id:'flower',n:'꽃',c:'#ffb3cf',st:1},{id:'star',n:'별',c:'#ffd257',st:1}];

/* ---------- 장면 ---------- */
const cv=$('#cv');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(Math.min(devicePixelRatio,1.75));R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
const scene=new THREE.Scene();scene.background=new THREE.Color('#bfe1ea');
const cam=new THREE.PerspectiveCamera(40,1,0.05,80);
const tall=()=>innerWidth/innerHeight<0.8;
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=tall()?52:40;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.7},o));
function ctex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);return new THREE.CanvasTexture(c)}
{const es=new THREE.Scene();es.background=new THREE.Color('#bcd9e2');const w=new THREE.Mesh(new THREE.PlaneGeometry(6,4),new THREE.MeshBasicMaterial({color:'#fff'}));w.position.set(2,3,-4);w.lookAt(0,0,0);es.add(w);const pm=new THREE.PMREMGenerator(R);scene.environment=pm.fromScene(es,0.02).texture}
scene.add(new THREE.HemisphereLight('#ffffff','#9fc3cf',0.6));
const sun=new THREE.DirectionalLight('#fff4e6',1.0);sun.position.set(-2,6,-5);scene.add(sun);
const fill=new THREE.DirectionalLight('#dff3ff',0.35);fill.position.set(3,3,5);scene.add(fill);
const LIGHT=new V3(-2,6,-5).normalize();
// 폭신한 담요
const fleeceT=ctex(128,128,(x,w,h)=>{x.fillStyle='#a9d6e2';x.fillRect(0,0,w,h);for(let i=0;i<2600;i++){x.fillStyle=Math.random()<0.5?'rgba(255,255,255,.18)':'rgba(70,140,160,.12)';const r=1+Math.random()*2;x.beginPath();x.arc(Math.random()*w,Math.random()*h,r,0,7);x.fill()}});fleeceT.wrapS=fleeceT.wrapT=THREE.RepeatWrapping;fleeceT.repeat.set(6,6);
const blanket=new THREE.Mesh(new THREE.PlaneGeometry(30,30,80,80),M('#ffffff',{map:fleeceT,roughness:1}));blanket.rotation.x=-Math.PI/2;scene.add(blanket);
{const p=blanket.geometry.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),r=Math.hypot(x,y);p.setZ(i,Math.sin(x*0.9)*0.08+Math.cos(y*0.7+x*0.3)*0.1+sst(3,9,r)*1.6*(0.6+0.4*Math.sin(Math.atan2(y,x)*3)))}blanket.geometry.computeVertexNormals()}
const shadowT=ctex(128,128,(x)=>{const g=x.createRadialGradient(64,64,4,64,64,62);g.addColorStop(0,'rgba(30,60,70,.5)');g.addColorStop(1,'rgba(30,60,70,0)');x.fillStyle=g;x.fillRect(0,0,128,128)});
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(2.8,3.6),new THREE.MeshBasicMaterial({map:shadowT,transparent:true,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.y=0.03;scene.add(shadow);

/* ---------- 몸 모양: 통통한 배와 동그란 엉덩이 ---------- */
const LZ=1.18,PIV=0.45,PY=0.62;
const PT=[-1,-0.7,-0.3,0.1,0.4,0.6,0.8,0.92,1],PW=[.66,.75,.76,.7,.63,.6,.55,.5,.46],PH=[.6,.66,.69,.68,.67,.65,.6,.54,.48],PC=[.6,.6,.6,.6,.61,.62,.6,.58,.56];
function ip(arr,t){for(let i=0;i<PT.length-1;i++)if(t<=PT[i+1]){const f=(t-PT[i])/(PT[i+1]-PT[i]),s=f*f*(3-2*f);return arr[i]+(arr[i+1]-arr[i])*s}return arr[arr.length-1]}
const env=t=>Math.pow(Math.max(0,1-t*t),t<0?0.2:0.09);
function bodyPt(t,a,off,out){const e=env(t),W=ip(PW,t)*e,H=ip(PH,t)*e,C=ip(PC,t),sa=Math.sin(a),ca=Math.cos(a);
  const m=sst(0.62,0.9,t)*(1-0.5*sst(0.975,1,t));let b=0;for(const pa of [-0.35,Math.PI+0.35]){const d=Math.atan2(Math.sin(a-pa),Math.cos(a-pa));b+=Math.exp(-d*d/0.5)}
  const bump=0.13*m*b,brow=0.05*sst(0.45,0.7,t)*(1-sst(0.85,1,t))*Math.max(0,sa);
  return out.set(ca*(W+off+bump),C+sa*(H*(sa<0?0.85:1)+off+bump+brow),t*LZ+bump*0.35)}
function fixSeams(g){const p=g.attributes.position,n=g.attributes.normal,map={};for(let i=0;i<p.count;i++){const k=Math.round(p.getX(i)*1e4)+','+Math.round(p.getY(i)*1e4)+','+Math.round(p.getZ(i)*1e4);(map[k]=map[k]||[]).push(i)}
  for(const k in map){const l=map[k];if(l.length<2)continue;let x=0,y=0,z=0;for(const i of l){x+=n.getX(i);y+=n.getY(i);z+=n.getZ(i)}const d=Math.hypot(x,y,z)||1;for(const i of l)n.setXYZ(i,x/d,y/d,z/d)}}
function makeBody(ws,hs){const g=new THREE.SphereGeometry(1,ws,hs);const p=g.attributes.position,v=new V3();
  for(let i=0;i<p.count;i++){const sx=p.getX(i),sy=p.getY(i),sz=p.getZ(i),st=Math.sqrt(Math.max(0,1-sy*sy));const a=st>1e-6?Math.atan2(sz,-sx):Math.PI/2;bodyPt(sy,a,0,v);p.setXYZ(i,v.x,v.y,v.z)}
  g.computeVertexNormals();fixSeams(g);return g}
const BODY=makeBody(90,72);

/* ---------- 노이즈·무늬·마스크 ---------- */

function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=b;src.loop=true;nF=AC.createBiquadFilter();nF.type='bandpass';nGain=AC.createGain();nGain.gain.value=0;src.connect(nF);nF.connect(nGain);nGain.connect(AC.destination);src.start()}catch(e){}}
function squeak(k=1,base=1150){if(!AC)return;const t=AC.currentTime;for(let i=0;i<k;i++){const o=AC.createOscillator(),g=AC.createGain(),s=t+i*0.17;o.type='triangle';o.frequency.setValueAtTime(base,s);o.frequency.exponentialRampToValueAtTime(base*1.7,s+0.08);o.frequency.exponentialRampToValueAtTime(base*1.35,s+0.15);g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.1,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.16);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+0.18)}}
function snip(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.setValueAtTime(2400,t);o.frequency.exponentialRampToValueAtTime(900,t+0.04);g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.06)}
function hum(k){if(!nGain)return;const t=AC.currentTime,c={shower:[2600,0.09],dryer:[700,0.07],shampoo:[4200,0.03],none:[1000,0]}[k]||[1000,0];nF.frequency.setTargetAtTime(c[0],t,0.05);nGain.gain.setTargetAtTime(c[1],t,0.06)}

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),ptrs=new Map();let mode=null,lx=0,ly=0,pinch=0,cur=null,grabStart=null,grabLocal=null,lastFx=0;const toolEl=$('#tool');

function startGrab(h,x,y){grabLocal=pig.worldToLocal(h.point.clone());grabStart={x,y,depth:cam.position.distanceTo(h.point)};cur=grab(grabLocal)}
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(p){p.x=e.clientX;p.y=e.clientY}
  if(mode==='pinch'&&ptrs.size>=2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)orbW.z=clamp(orbW.z*pinch/d,1.6,9);pinch=d;return}
  if(!p)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  if(mode==='orbit'){orbW.x-=dx*0.009;orbW.y=clamp(orbW.y-dy*0.007,0.2,1.4);return}
  if(mode==='tool'){place(lx,ly);dragFlesh(lx,ly);const h=hitAt(lx,ly);if(h)useTool(h,Math.hypot(dx,dy));else hum('none')}});
function dragFlesh(x,y){if(!cur||!grabStart)return;const wpp=2*grabStart.depth*Math.tan(cam.fov*Math.PI/360)/innerHeight;
  const right=new V3().setFromMatrixColumn(cam.matrixWorld,0),upv=new V3().setFromMatrixColumn(cam.matrixWorld,1);
  const wd=right.multiplyScalar((x-grabStart.x)*wpp).add(upv.multiplyScalar(-(y-grabStart.y)*wpp));
  const pull={hand:0.9,comb:0.35+0.9*sample('tangle',grabUv.x,grabUv.y),shower:0.15,shampoo:0.45,scissors:0.2,dryer:0.1,deco:0.3}[tool];
  const inv=new THREE.Matrix3().setFromMatrix4(pig.matrixWorld).invert();const ld=wd.applyMatrix3(inv).multiplyScalar(pull);const mx=0.3;if(ld.length()>mx)ld.setLength(mx);cur.tg.copy(ld);
  // 너무 멀리 끌면 '뽀용' 하고 놓치며 출렁
  if(Math.hypot(x-grabStart.x,y-grabStart.y)>110){letGo(cur);const h=hitAt(x,y);if(h){startGrab(h,x,y);grabUv=h.uv.clone()}else cur=null;
    if(tool==='comb'&&sample('tangle',grabUv.x,grabUv.y)>0.45&&speakT<=0){say(rnd(['아야!','살살 해 주세요!','엉킨 데 아파요!']),1.3);squeak(2,1500)}}}

    if(f.s.position.y<0.05){f.s.position.y=0.05;f.v.set(0,0,0)}f.s.material.opacity=Math.min(1,f.life/f.max*2);if(f.life<=0){scene.remove(f.s);f.s.material.dispose();fx.splice(i,1)}}

    if(turning>4.6&&turning-dt<=4.6)finish()}
  shadow.rotation.z=-pig.rotation.y;

  R.render(scene,cam)}
paintCoat(0);newGame();requestAnimationFrame(loop);
}
